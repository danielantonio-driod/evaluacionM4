<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Gestión de Tareas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 TaskFlow</h1>
            <p class="subtitle">Gestión de Tareas en JavaScript</p>
        </header>

        <!-- Formulario para agregar tareas -->
        <section class="task-form-section">
            <h2>➕ Nueva Tarea</h2>
            <form id="taskForm" class="task-form">
                <div class="form-group">
                    <label for="taskDescription">Descripción de la tarea:</label>
                    <input 
                        type="text" 
                        id="taskDescription" 
                        name="taskDescription" 
                        placeholder="Escribe tu tarea aquí..." 
                        required
                    >
                    <span class="char-count" id="charCount">0 caracteres</span>
                </div>
                
                <div class="form-group">
                    <label for="taskDeadline">Fecha límite (opcional):</label>
                    <input 
                        type="datetime-local" 
                        id="taskDeadline" 
                        name="taskDeadline"
                    >
                </div>

                <button type="submit" class="btn btn-primary">
                    Agregar Tarea
                </button>
            </form>
        </section>

        <!-- Filtros -->
        <section class="filters">
            <h3>Filtrar tareas:</h3>
            <div class="filter-buttons">
                <button class="btn btn-filter active" data-filter="all">Todas</button>
                <button class="btn btn-filter" data-filter="pending">Pendientes</button>
                <button class="btn btn-filter" data-filter="completed">Completadas</button>
            </div>
        </section>

        <!-- Lista de tareas -->
        <section class="tasks-section">
            <h2>📝 Mis Tareas</h2>
            <div id="tasksList" class="tasks-list">
                <!-- Las tareas se agregarán dinámicamente aquí -->
            </div>
            <div id="emptyState" class="empty-state">
                <p>No hay tareas. ¡Agrega una nueva tarea para comenzar!</p>
            </div>
        </section>

        <!-- Notificaciones -->
        <div id="notifications" class="notifications"></div>

        <!-- Botón para cargar tareas desde API -->
        <section class="api-section">
            <h3>🌐 Sincronización con API</h3>
            <div class="api-buttons">
                <button id="loadFromAPI" class="btn btn-secondary">
                    Cargar Tareas de JSONPlaceholder
                </button>
                <button id="saveToLocalStorage" class="btn btn-secondary">
                    Guardar en LocalStorage
                </button>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
